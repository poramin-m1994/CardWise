<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="./images/favicon.png" />
  <title>CardWise | เข้าสู่ระบบ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles/global.css" />
  
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>
<body class="bg-[#F4F6F8] dark:bg-gray-900 text-gray-800 dark:text-gray-100 flex items-center justify-center h-screen">


  <!-- Login Card -->
  <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md z-10">
    <div class="flex justify-center mb-6">
      <img src="images/logo.png" alt="CardWise Logo" class="w-30 h-30 drop-shadow-md">
    </div>
    <h2 class="text-xl font-semibold text-center text-gray-700 mb-6">เข้าสู่ระบบ</h2>

    <form id="loginForm">
      <div class="mb-4">
        <label for="username" class="block text-gray-600 mb-1">ชื่อผู้ใช้</label>
        <input type="text" id="username" class="w-full border border-gray-300 p-3 rounded-lg 
         focus:outline-none focus:ring-2 focus:ring-[#4CAF50] 
         text-gray-800 dark:bg-gray-700 dark:text-gray-100" required />
      </div>
      <div class="mb-6">
        <label for="password" class="block text-gray-600 mb-1">รหัสผ่าน</label>
        <input type="password" id="password" class="w-full border border-gray-300 p-3 rounded-lg 
         focus:outline-none focus:ring-2 focus:ring-[#4CAF50] 
         text-gray-800 dark:bg-gray-700 dark:text-gray-100" required />
      </div>
      <button type="submit" class="w-full bg-[#4CAF50] hover:bg-green-600 text-white py-3 rounded-xl font-semibold transition">เข้าสู่ระบบ</button>
    </form>

    <p id="errorMsg" class="text-red-500 mt-4 text-center hidden">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</p>
    
    <!-- Dark Mode Toggle -->
    <div class="mt-6 text-center">
      <button onclick="toggleDarkMode()" class="text-sm text-gray-600 dark:text-gray-300 underline hover:text-[#4CAF50] transition">
        <span id="themeLabel">เปิดโหมดกลางคืน</span>
      </button>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="fixed inset-0 bg-white bg-opacity-80 z-50 hidden flex items-center justify-center flex-col">
    <div class="animate-spin h-10 w-10 rounded-full border-4 border-t-green-500 border-gray-300 mb-4"></div>
    <p class="text-gray-700">กำลังเข้าสู่ระบบ...</p>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 right-5 bg-green-500 text-white py-2 px-4 rounded-lg shadow-lg hidden z-50">
    เข้าสู่ระบบสำเร็จ
  </div>
  <script type="module" src="js/index.js"></script>
</body>
</html>
