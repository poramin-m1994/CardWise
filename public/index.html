<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ | CardWise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Kanit', sans-serif;
    }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>
<body class="bg-[#F4F6F8] dark:bg-gray-900 text-gray-800 dark:text-gray-100 flex items-center justify-center h-screen">


  <!-- Login Card -->
  <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md z-10">
    <div class="flex justify-center mb-6">
      <img src="images/logo.png" alt="CardWise Logo" class="w-30 h-30 drop-shadow-md">
    </div>
    <h2 class="text-xl font-semibold text-center text-gray-700 mb-6">เข้าสู่ระบบ</h2>

    <form id="loginForm">
      <div class="mb-4">
        <label for="username" class="block text-gray-600 mb-1">ชื่อผู้ใช้</label>
        <input type="text" id="username" class="w-full border border-gray-300 p-3 rounded-lg 
         focus:outline-none focus:ring-2 focus:ring-[#4CAF50] 
         text-gray-800 dark:bg-gray-700 dark:text-gray-100" required />
      </div>
      <div class="mb-6">
        <label for="password" class="block text-gray-600 mb-1">รหัสผ่าน</label>
        <input type="password" id="password" class="w-full border border-gray-300 p-3 rounded-lg 
         focus:outline-none focus:ring-2 focus:ring-[#4CAF50] 
         text-gray-800 dark:bg-gray-700 dark:text-gray-100" required />
      </div>
      <button type="submit" class="w-full bg-[#4CAF50] hover:bg-green-600 text-white py-3 rounded-xl font-semibold transition">เข้าสู่ระบบ</button>
    </form>

    <p id="errorMsg" class="text-red-500 mt-4 text-center hidden">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</p>
    
    <!-- Dark Mode Toggle -->
    <div class="mt-6 text-center">
      <button onclick="toggleDarkMode()" class="text-sm text-gray-600 dark:text-gray-300 underline hover:text-[#4CAF50] transition">
        <span id="themeLabel">เปิดโหมดกลางคืน</span>
      </button>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="fixed inset-0 bg-white bg-opacity-80 z-50 hidden flex items-center justify-center flex-col">
    <div class="animate-spin h-10 w-10 rounded-full border-4 border-t-green-500 border-gray-300 mb-4"></div>
    <p class="text-gray-700">กำลังเข้าสู่ระบบ...</p>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 right-5 bg-green-500 text-white py-2 px-4 rounded-lg shadow-lg hidden z-50">
    เข้าสู่ระบบสำเร็จ
  </div>

  <script>
    const URL = 'https://script.google.com/macros/s/AKfycbwrcejldAoKiI2v0xUI24aXuf_ZdN78u94se0o46NEDFW-AhxG67LqvkvlDVfcPn3Rmgw/exec';

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      // เริ่มแสดง Loading
      document.getElementById('loadingOverlay').classList.remove('hidden');
      document.getElementById('errorMsg').classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch(`${URL}?sheet=Users`);
        const users = await res.json();

        const found = users.find(user => user.username === username && user.password === password);
        if (found) {
          localStorage.setItem("userSession", JSON.stringify({ username }));

          // แสดง toast แจ้งเตือน 1.5 วินาที
          const toast = document.getElementById('toast');
          toast.classList.remove('hidden');
          setTimeout(() => {
            toast.classList.add('hidden');
            window.location.href = 'landing.html';
          }, 1500);
        } else {
          document.getElementById('errorMsg').classList.remove('hidden');
        }
      } catch (error) {
        console.error("เกิดข้อผิดพลาด:", error);
        document.getElementById('errorMsg').textContent = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
        document.getElementById('errorMsg').classList.remove('hidden');
      } finally {
        // ซ่อน loading ไม่ว่าจะสำเร็จหรือไม่
        document.getElementById('loadingOverlay').classList.add('hidden');
      }
    });
  </script>
  <script>
    // โหลดธีมจาก localStorage ถ้ามี
    const isDark = localStorage.getItem('theme') === 'dark';
    if (isDark) {
      document.documentElement.classList.add('dark');
      document.getElementById('themeLabel').textContent = 'ปิดโหมดกลางคืน';
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      html.classList.toggle('dark');
      const isNowDark = html.classList.contains('dark');
      localStorage.setItem('theme', isNowDark ? 'dark' : 'light');
      document.getElementById('themeLabel').textContent = isNowDark ? 'ปิดโหมดกลางคืน' : 'เปิดโหมดกลางคืน';
    }
  </script>


</body>
</html>
