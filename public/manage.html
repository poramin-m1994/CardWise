<!DOCTYPE html>
<html lang="th" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>จัดการหมวดหมู่ & บัตร | CardWise</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles/global.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
</head>
<body class="bg-[#F4F6F8] dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen">

  <!-- Navigation Bar -->
  <nav class="bg-white dark:bg-gray-800 shadow-md px-6 py-4 flex flex-col sm:flex-row justify-between items-center">
    <div class="flex items-center space-x-3">
      <h1 class="text-2xl font-extrabold text-[#1D3557] dark:text-white">Card<span class="text-[#4CAF50]">Wise</span></h1>
    </div>
    <div class="mt-2 sm:mt-0 flex flex-wrap gap-3 text-sm font-medium items-center">
      <a href="landing.html" class="text-gray-700 dark:text-gray-200 hover:text-white hover:bg-[#4CAF50] px-4 py-2 rounded-full transition">หน้าหลัก</a>
      <a href="main.html" class="text-gray-700 dark:text-gray-200 hover:text-white hover:bg-[#4CAF50] px-4 py-2 rounded-full transition">บันทึกรายจ่าย</a>
      <a href="summary.html" class="text-gray-700 dark:text-gray-200 hover:text-white hover:bg-[#4CAF50] px-4 py-2 rounded-full transition">ดูรายงาน</a>
      <a href="manage.html" class="text-white bg-[#4CAF50] px-4 py-2 rounded-full transition shadow">หมวดหมู่/บัตร</a>
      <button onclick="logout()" class="text-red-600 dark:text-red-400 hover:text-white hover:bg-red-500 px-4 py-2 rounded-full transition">ออกจากระบบ</button>
      <button onclick="toggleDarkMode()" class="text-sm underline text-gray-600 dark:text-gray-300 ml-2" id="themeLabel">เปิดโหมดกลางคืน</button>
    </div>
  </nav>

  <!-- Loading Screen -->
  <div id="loadingScreen" class="fixed inset-0 bg-white dark:bg-gray-900 bg-opacity-90 flex flex-col items-center justify-center z-50">
    <div class="animate-spin h-12 w-12 rounded-full border-4 border-t-[#4CAF50] border-gray-300 mb-4"></div>
    <p class="text-gray-700 dark:text-gray-200 text-lg font-medium">กำลังโหลดข้อมูล...</p>
  </div>

  <!-- Main Content -->
  <div id="mainContent" class="max-w-4xl mx-auto mt-10 p-6 bg-white dark:bg-gray-800 rounded-xl shadow hidden">
    <h1 class="text-2xl font-bold text-center text-[#1D3557] dark:text-white mb-8">จัดการหมวดหมู่และบัตร</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- หมวดหมู่ -->
      <section>
        <h2 class="text-xl font-semibold mb-4 text-gray-800 dark:text-gray-200">หมวดหมู่</h2>
        <div class="flex gap-2 mb-4">
          <input id="newCategory" class="flex-1 border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#4CAF50] bg-white dark:bg-gray-700 text-gray-700 dark:text-white" placeholder="เพิ่มหมวดหมู่ใหม่" />
          <button onclick="addItem('category')" class="bg-[#4CAF50] hover:bg-green-600 text-white px-4 py-2 rounded-lg transition">เพิ่ม</button>
        </div>
        <ul id="categoryList" class="space-y-2 text-sm"></ul>
      </section>

      <!-- บัตร -->
      <section>
        <h2 class="text-xl font-semibold mb-4 text-gray-800 dark:text-gray-200">บัตร</h2>
        <div class="flex gap-2 mb-4">
          <input id="newCard" class="flex-1 border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#4CAF50] bg-white dark:bg-gray-700 text-gray-700 dark:text-white" placeholder="เพิ่มชื่อบัตรใหม่" />
          <button onclick="addItem('card')" class="bg-[#4CAF50] hover:bg-green-600 text-white px-4 py-2 rounded-lg transition">เพิ่ม</button>
        </div>
        <ul id="cardList" class="space-y-2 text-sm"></ul>
      </section>
    </div>
  </div>

  <!-- Script -->
  <script type="module" src="./js/manage.js"></script>
</body>
</html>
